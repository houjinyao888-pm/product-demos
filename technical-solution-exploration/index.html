<script>window.PUBLIC_DEMO_CASE={"version":2,"case_id":"battery-260","label":"锂电池研发","opening_input":"想提升锂电池的能量密度。","clarification":{"origin":"演示补写","note":"为了判断有哪些可探索的技术路线，需要先明确提升目标和必须保留的约束。","questions":[{"id":"target","label":"希望提升到什么水平？","reason":"目标值决定本次探索要解决的问题。","required":true,"options":[{"id":"260","label":"质量能量密度达到 260 Wh/kg"}]},{"id":"volume","label":"电芯体积有什么限制？","reason":"用于约束后续方向与方案。","required":true,"options":[{"id":"fixed","label":"总体积不增加"}]},{"id":"baseline","label":"已有材料体系、基线性能和工况吗？","reason":"暂未提供也可以继续，会作为待确认信息保留。","required":false,"options":[{"id":"unknown","label":"暂不确定，后续验证时补充"}]}]},"problem":{"id":"problem","technical_object":"锂离子电池电芯","current_problem":"当前电芯需要提升质量能量密度至 260 Wh/kg。","objective":"在总体积不增加的条件下，将锂离子电池电芯的质量能量密度提高至 260 Wh/kg。","constraints":["总体积不增加。"],"unknowns":["现有化学体系与外形尺寸","基线能量密度","倍率、循环和安全工况"],"confirmed_input":"如何提高锂电池能量密度到260Wh/kg，且总体积不增加？"},"directions":[{"id":"direction-1","title":"高镍正极面密度与压实协同提升","summary":"在不增加电芯外形体积的前提下，围绕正极活性材料面密度、压实与界面稳定性协同调整，以提高单位质量储能贡献并控制极片厚度和循环风险。","scope":"本领域路线","focus":"正极活性材料的面密度、压实状态与界面稳定性。","expected_effect":"在控制极片厚度和界面副作用的条件下，提高单位质量可贡献的储能。","constraint":"高载量与压实可能增加传输和循环风险，需在固定外形下验证。"},{"id":"direction-2","title":"负极可逆容量与首效补偿协同","summary":"围绕负极可逆容量、首圈不可逆损失与界面稳定性形成协同调整路径，在既定体积内探索提高可用容量的可能性。","scope":"本领域路线","focus":"负极可逆容量、首效损失与界面稳定性。","expected_effect":"通过减少不可逆容量占用和提高负极有效容量，增加可用储能贡献。","constraint":"负极膨胀和界面稳定性是否满足既定体积边界尚未确认。"},{"id":"direction-3","title":"非活性部件薄型化与空间重分配","summary":"从集流、隔离、连接和封装等非活性组成的质量与空间占用出发，探索在不扩大外形体积时为活性储能部分释放结构预算。","scope":"相邻领域启发","focus":"集流、隔离、连接和封装等非活性组成的结构占用。","expected_effect":"释放内部质量或空间预算，为活性储能组成保留可用余量。","constraint":"薄型化和空间重分配可能影响机械、绝缘和热安全边界。"},{"id":"direction-4","title":"极片传输路径与结构层级协同","summary":"通过极片内部传输路径、层级结构和制造窗口的协同设计，探索降低阻抗与无效结构占用对高载量方案的限制。","scope":"本领域路线","focus":"极片内部传输路径、层级结构和制造窗口。","expected_effect":"降低传输与结构限制对高载量利用效率的影响，为活性材料贡献留出可验证窗口。","constraint":"结构层级变化可能增加制造复杂度或改变厚度边界。"}],"solutions":[{"id":"solution-1","direction_id":"direction-1","parent_id":null,"round":0,"title":"高镍正极面密度、压实与界面稳定化协同窗口","summary":"在不改变电芯外形的前提下，以高镍正极的面密度与压实为主变量，并将界面稳定化措施纳入同一制造窗口；通过电极级和整芯级验证，判断其对质量能量密度提升及体积约束的实际贡献。","mechanism":"将正极面密度、辊压压实与界面稳定化纳入同一试验窗口，在固定电芯外形下验证厚度、浸润和性能之间的取舍。该组合为工程推断，专利摘要仅支持其中的相关技术手段。","changes":["正极极片：调整活性材料装载、涂布与辊压窗口。","材料处理：在验证范围内引入高镍正极表面或界面稳定化处理。"],"benefits":["在电芯外形不变的约束下，增加单位电芯内活性材料贡献的验证机会。","将高压实带来的界面稳定性风险前置到同一工艺窗口评估。"],"risks":["高面密度或过度压实可能带来浸润、倍率和循环衰减风险。","界面稳定化处理的制造兼容性和量产一致性尚未在本项目中验证。"],"steps":["建立现有高镍正极极片的面密度、压实密度、孔隙率、厚度和电化学基线。","以单面面密度和辊压条件为主变量，设计不增加电芯总体积的极片试验矩阵。","在候选窗口中导入已验证可制造的表面或界面稳定化措施，并评估其与压实的耦合影响。","对入选极片完成半电池、全电芯和体积复核，比较质量能量密度、循环、倍率和安全相关指标。"],"assumptions":["现有制造线可在试验范围内调整涂布和辊压参数。","项目可获得当前极片和电芯的基线测试数据。"],"validation":["记录各试验点的面密度、压实密度、孔隙率、极片厚度及电芯总体积。","比较质量能量密度、循环、倍率、浸润和安全相关指标。","确认界面或表面处理在工艺窗口内的可制造性与批间一致性。"],"limitations":["现有证据来自公开摘要，未提供本项目电芯的完整配方、尺寸、成本或安全验证数据。","260 Wh/kg 及总体积不增加仍需在整电芯级进行实测和体积复核。"],"refinement":"","origin":"历史案例回放","claim_type":"待验证工程设计","evidence_note":"专利摘要提供相关技术参考，不证明本方案达到性能目标。","evidence":[{"evidence_id":"evidence-1","relevance":"直接相关依据","roles":["核心机理","问题与效果","约束处理"],"support_note":"记录在镍基锂离子电池中同时描述正极压实密度、界面膜相关条件和能量密度/循环权衡，可支持当前候选的来源技术事实。","inherited":false},{"evidence_id":"evidence-2","relevance":"直接相关依据","roles":["核心机理","问题与效果","约束处理"],"support_note":"记录直接覆盖正极面密度、界面相关条件和能量密度/性能权衡，可支持当前候选的来源技术事实。","inherited":false},{"evidence_id":"evidence-3","relevance":"直接相关依据","roles":["核心机理","实施方式","风险与边界"],"support_note":"记录直接涉及富镍正极的界面处理和制成稳定性，可支持候选中界面稳定化处理的来源技术事实。","inherited":false},{"evidence_id":"evidence-4","relevance":"直接相关依据","roles":["核心机理","迁移启发","问题与效果"],"support_note":"记录能支持来源材料体系中以面密度和压实密度提升电能量的事实；迁移至高镍正极须保留材料体系与界面适配限制。","inherited":false},{"evidence_id":"evidence-5","relevance":"直接相关依据","roles":["核心机理","问题与效果","实施方式"],"support_note":"记录在正极极片层面披露压实和面密度与离子传导、内阻和能量密度的关联，可支持当前候选的工艺窗口来源事实。","inherited":false},{"evidence_id":"evidence-6","relevance":"直接相关依据","roles":["核心机理","实施方式","约束处理"],"support_note":"记录可支撑正极材料中压实密度、扩散与界面稳定性协同的来源技术事实。","inherited":false}]},{"id":"solution-2","direction_id":"direction-1","parent_id":"solution-1","round":1,"title":"既有涂布压实链内的高镍正极分段窗口与界面稳定化配对","summary":"该派生方案继承父方案的高镍正极面密度、压实和界面稳定化协同机制，但将实施路径收敛为既有涂布、辊压与可兼容界面处理内的分段试验窗口，以优先验证工程可实施性并降低对电芯结构的大幅修改。","mechanism":"父方案的可读专利证据将正极压实密度、单面面密度和界面稳定化分别与电池性能联系起来。基于这些来源事实，派生方案先在既有涂布与辊压链内筛选有限窗口，再对入选窗口配对界面处理，并在固定外形下复核厚度、体积和性能。","changes":["正极极片：在现有涂布和辊压设备允许的范围内设置分段面密度与压实窗口。","界面处理：仅对通过初筛的窗口使用兼容的高镍正极表面或界面稳定化步骤。"],"benefits":["保留父方案的核心作用机制，同时减少新结构、新设备和大范围工艺改造的依赖。","使总体积、厚度、浸润和制造一致性在早期窗口筛选中得到直接验证。"],"risks":["有限窗口可能不足以获得预期的能量密度提升。","界面处理可能与既有涂布、辊压节拍或批间一致性不兼容。"],"steps":["明确现有涂布、辊压及常规界面处理的可调范围，建立固定外形基线样品。","以有限的面密度和辊压分段窗口制备极片，优先排除厚度、浸润或加工稳定性明显不满足条件的组合。","仅对入选窗口配对兼容的界面稳定化处理，并保持电芯结构不变。","对候选窗口完成能量密度、极片厚度、电芯总体积、内阻、循环和一致性对照。"],"assumptions":["现有制造链可在试验范围内调整面密度、辊压和界面处理步骤。","项目能够获取基线极片与整电芯的体积和性能数据用于对照。"],"validation":["记录每个窗口的面密度、压实密度、孔隙率、极片厚度与电芯总体积。","比较基线和候选窗口的质量能量密度、内阻、循环、倍率与浸润表现。","验证界面处理与既有工艺节拍、良率及批间一致性的兼容性。"],"limitations":["本轮新增检索未产生可读的新核心证据；本方案的事实基础继承自父方案证据。","公开摘要未提供本项目的产线参数上下限、完整化学体系或 260 Wh/kg 的整电芯验证结果。"],"refinement":"在保持当前方案核心机制的基础上，进一步优化工程可实施性，并降低对现有结构的大幅修改。","origin":"历史案例回放","claim_type":"待验证工程设计","evidence_note":"沿用父方案证据。历史深化未形成新增可读核心证据，不代表本轮重新检索。","evidence":[{"evidence_id":"evidence-1","relevance":"直接相关依据","roles":["核心机理","问题与效果","约束处理"],"support_note":"记录在镍基锂离子电池中同时描述正极压实密度、界面膜相关条件和能量密度/循环权衡，可支持当前候选的来源技术事实。","inherited":true},{"evidence_id":"evidence-2","relevance":"直接相关依据","roles":["核心机理","问题与效果","约束处理"],"support_note":"记录直接覆盖正极面密度、界面相关条件和能量密度/性能权衡，可支持当前候选的来源技术事实。","inherited":true},{"evidence_id":"evidence-3","relevance":"直接相关依据","roles":["核心机理","实施方式","风险与边界"],"support_note":"记录直接涉及富镍正极的界面处理和制成稳定性，可支持候选中界面稳定化处理的来源技术事实。","inherited":true},{"evidence_id":"evidence-6","relevance":"直接相关依据","roles":["核心机理","实施方式","约束处理"],"support_note":"记录可支撑正极材料中压实密度、扩散与界面稳定性协同的来源技术事实。","inherited":true},{"evidence_id":"evidence-5","relevance":"直接相关依据","roles":["核心机理","问题与效果","实施方式"],"support_note":"记录在正极极片层面披露压实和面密度与离子传导、内阻和能量密度的关联，可支持当前候选的工艺窗口来源事实。","inherited":true},{"evidence_id":"evidence-4","relevance":"直接相关依据","roles":["核心机理","迁移启发","问题与效果"],"support_note":"记录能支持来源材料体系中以面密度和压实密度提升电能量的事实；迁移至高镍正极须保留材料体系与界面适配限制。","inherited":true}]},{"id":"solution-3","direction_id":"direction-1","parent_id":"solution-2","round":2,"title":"高镍正极分段窗口的分阶段筛选与整芯验证路径","summary":"第二轮演示预设：继承第一轮的分段面密度、压实与界面处理窗口，将验证分为极片初筛、处理配对和固定外形整芯对照。各阶段记录不通过原因，再决定是否推进。","mechanism":"待验证工程假设：先筛查厚度、浸润和加工稳定性，再对入选窗口开展界面处理配对，可能减少同时改变多个因素造成的判断困难。未执行新增检索或工程试验。","changes":["保留原高镍正极、现有涂布与辊压链和固定电芯外形。","将第一轮试验矩阵拆为有进入条件的阶段，逐项记录筛选依据。"],"benefits":["预期有助于区分极片加工问题与界面处理影响；尚待验证。","预期使整芯对照的输入条件更清晰；不承诺性能提升。"],"risks":["早期筛选可能遗漏在其他条件下有效的窗口。","极片级表现不能替代整芯能量密度、体积和安全验证。"],"steps":["建立基线并明确厚度、浸润、加工稳定性的实测口径；数值门槛由研发确认。","在第一轮窗口内开展极片初筛，保留对照样及每个未通过点的原因。","仅对通过初筛的窗口配对界面处理，复核制造兼容性和一致性。","对通过前两阶段的组合开展固定外形整芯对照，记录质量能量密度、体积、循环和安全相关指标。"],"assumptions":["第一轮分段窗口与基线样品可供比较；尚未实测确认。","研发团队能够提供阶段进入条件和可接受的安全边界。"],"validation":["确认阶段门槛及测量重复性。","检查筛选过程中是否遗漏潜在有效窗口。","完成整芯级体积与性能对照后再判断是否接近目标。"],"limitations":["本方案是为连续下钻新增的演示预设，不是模型或检索新结果。","专利材料仅沿用父方案的来源背景，不能证明本轮验证顺序或 260 Wh/kg 目标有效。"],"refinement":"在第一轮分段窗口方案基础上，先完成极片厚度、浸润与加工稳定性的初筛，再进入整芯对照；保留固定体积约束，明确每一步的进入条件。","origin":"演示补写","claim_type":"待验证工程设计","evidence_note":"沿用父方案证据 · 本轮未新增检索，不能据此证明新方案有效。","evidence":[{"evidence_id":"evidence-1","relevance":"直接相关依据","roles":["核心机理","问题与效果","约束处理"],"support_note":"记录在镍基锂离子电池中同时描述正极压实密度、界面膜相关条件和能量密度/循环权衡，可支持当前候选的来源技术事实。","inherited":true},{"evidence_id":"evidence-2","relevance":"直接相关依据","roles":["核心机理","问题与效果","约束处理"],"support_note":"记录直接覆盖正极面密度、界面相关条件和能量密度/性能权衡，可支持当前候选的来源技术事实。","inherited":true},{"evidence_id":"evidence-3","relevance":"直接相关依据","roles":["核心机理","实施方式","风险与边界"],"support_note":"记录直接涉及富镍正极的界面处理和制成稳定性，可支持候选中界面稳定化处理的来源技术事实。","inherited":true},{"evidence_id":"evidence-6","relevance":"直接相关依据","roles":["核心机理","实施方式","约束处理"],"support_note":"记录可支撑正极材料中压实密度、扩散与界面稳定性协同的来源技术事实。","inherited":true},{"evidence_id":"evidence-5","relevance":"直接相关依据","roles":["核心机理","问题与效果","实施方式"],"support_note":"记录在正极极片层面披露压实和面密度与离子传导、内阻和能量密度的关联，可支持当前候选的工艺窗口来源事实。","inherited":true},{"evidence_id":"evidence-4","relevance":"直接相关依据","roles":["核心机理","迁移启发","问题与效果"],"support_note":"记录能支持来源材料体系中以面密度和压实密度提升电能量的事实；迁移至高镍正极须保留材料体系与界面适配限制。","inherited":true}]}],"evidence":[{"id":"evidence-1","publication_number":"CN115275181A","title":"一种锂离子电池及电池组","excerpt":"本发明提供了一种锂离子电池及电池组，包括电解液、电芯和用于容纳所述电解液和电芯的外壳，其中，锂离子电池在经充放电后，正极活性物质层表面形成一固态电解质界面膜，至少固态电解质界面膜中包括硫元素和硼元素，硫元素和硼元素的重量之和在正极活性物质层和固态电解质界面膜的重量之和中的占比为k，单位为wt％；以电解液的电导率为d，单位mS/cm；以正极活性物质层的压实密度为ρ，单位g/cm3；以锂镍基活性材料中镍元素的重量百分比为r，r为20～60wt％；满足以下关系式：0.3≤(100·d·k·ρ/r)≤45。相比于现有的镍基正极电池，本发明的高镍基锂离子电池可同时兼顾能量密度和循环性能、存储性能和倍率性能。"},{"id":"evidence-2","publication_number":"CN115275319A","title":"一种锂离子电池、电池包","excerpt":"本发明提供了一种锂离子电池、电池包，包括电解液、电芯和用于容纳所述电解液和电芯的外壳，其中，锂离子电池在经充放电后，正极活性物质层表面形成一固态电解质界面膜，至少固态电解质界面膜中包括硫元素和硅元素，硫元素和硅元素的重量和在正极活性物质层和固态电解质界面膜的重量和中的占比为k，单位为wt％；以电解液的电导率为d，单位mS/cm；以正极活性物质层的单面面密度为s，单位g/cm2；以锂镍基活性材料中镍元素的重量百分比为r，单位为wt％；满足以下关系式：0.1≤(d·k·s/r)≤40。相比于现有的镍基正极电池，本发明的锂离子电池可同时兼顾能量密度和循环性能、存储性能、倍率性能。"},{"id":"evidence-3","publication_number":"CN121394359A","title":"富镍正极材料及其制备方法、正极片、锂离子电池和用电设备","excerpt":"本申请提供一种富镍正极材料及其制备方法、正极片、锂离子电池和用电设备，涉及新能源技术领域。本申请提供的富镍正极材料的制备方法区别于传统水洗法，采用含有R‑O‑M‑R’化合物的疏水溶液对高镍三元正极材料界面进行处理，R‑O‑M‑基团与材料表面活性Li水解反应，另一侧R’有机官能团因其自身疏水功能性让材料也拥有疏水能力，提高材料界面对水分的化学稳定性，提高材料的储存性能及电芯制成稳定性和电芯的使用性能。"},{"id":"evidence-4","publication_number":"CN105552431A","title":"一种掺杂石墨烯的高能量磷酸铁锂电池","excerpt":"本发明公开了一种掺杂石墨烯的高能量磷酸铁锂电池，所述磷酸铁锂电池的原料包括以磷酸铁锂、锰酸锂或磷酸锰铁锂为正极的活性材料和以石墨为负极的活性材料。所述正极活性材料的克比容量为170～190mAh/g，首次效率为98.8～99.6％，双面面密度为11～55mg/cm2，正极压实密度1.7～2.8g/cm2。所述石墨的克比容量为355～365mAh/g；负极压实密度为1.2～1.99g/cm2，负极面密度以对应的正极活性物质过量比为5％～30％计算其的面密度。本发明的高能量磷酸铁锂电池安全性稳定，耐用性强，体积小，充电速率快，充电放电持久，续航能力长；通过提高振实密度来提高电能量；通过正极材料制作加入石墨烯开提高电能量；与同行业电池相比，同样体积的电池要耐用20％以上。"},{"id":"evidence-5","publication_number":"CN113497222A","title":"一种锂离子电池正极浆料及正极极片","excerpt":"本发明公开了一种锂离子电池正极浆料及正极极片，所述的正极浆料及正极极片，所述的正极浆料由正极活性材料、导电剂、粘接剂、正极添加剂及有机溶剂组成，所述的正极极片由正极浆料涂覆烘干而成，所述的正极添加剂为多孔碳粉，所述导电剂为碳纳米管和鳞片层状结构的导电石墨的复合导电剂。本发明所制备的浆料及极片，有利于提高极片吸液率，增强锂离子的传导速率，降低电池内阻，提高电池倍率性能；同时可提高正极极片的压实及面密度，防止极片粘辊、掉粉，降低电池内阻，提高能量密度，降低生产成本。"},{"id":"evidence-6","publication_number":"CN121282146A","title":"一种正极活性材料、二次电池和用电装置","excerpt":"本申请公开了一种正极活性材料、二次电池和用电装置，属于电池技术领域。本申请提供的正极活性材料具有较高的压实密度、较低的锰溶出率，以及良好的锂离子扩散系数，并且得到的正极活性材料的界面稳定性优异；进而将其应用于二次电池时，得到的二次电池具有良好的循环性能和倍率性能。"}],"target_direction_id":"direction-1","direction_edit":{"id":"direction-2","title":"负极可逆容量与首效补偿协同（补充体积边界）","summary":"围绕负极可逆容量、首圈不可逆损失与界面稳定性形成协同调整路径，在既定体积内探索提高可用容量的可能性。","scope":"本领域路线","focus":"负极可逆容量、首效损失与界面稳定性。","expected_effect":"通过减少不可逆容量占用和提高负极有效容量，增加可用储能贡献。","constraint":"负极膨胀和界面稳定性是否满足既定体积边界尚未确认。"},"direction_add":{"id":"direction-5","title":"连接与安全功能件一体化的非活性占比控制","summary":"在不改变电芯外形体积的前提下，探索将连接、绝缘或缓冲等结构功能协同集成，减少重复的非活性部件占比并保留必要的安全接口。","scope":"相邻领域启发","focus":"连接、绝缘、缓冲等结构功能之间的重复部件与接口。","expected_effect":"在保持必要安全功能的条件下减少重复占用，为活性储能部分保留质量或空间预算。","constraint":"功能整合不能削弱绝缘、机械或热安全边界，需作为后续验证条件。"},"report":{"title":"锂离子电池 260 Wh/kg 与总体积约束下的技术方案探索报告","contradiction":"需要在总体积不增加的前提下提高电芯质量能量密度，但正极面密度和压实提升可能同时压缩浸润、传输、循环与制造一致性的安全窗口。","disclaimer":"本报告仅用于技术方案探索和验证优先级讨论，不构成工程可行性结论、性能达标承诺、专利性判断、侵权/FTO 意见或量产决策。","evidence_boundary":"证据来自历史案例的公开专利摘要，不替代工程试验。方向和方案均不代表已实现 260 Wh/kg 或总体积不增加。","findings":[{"statement":"CN115275181A 的摘要将镍基锂离子电池正极活性物质层压实密度、固态电解质界面膜与电解液电导率置于同一技术关系中，并描述能量密度和循环、储存、倍率性能。","claim_type":"来源事实","evidence_ids":["evidence-1"]},{"statement":"CN115275319A 的摘要披露镍基锂离子电池正极活性物质层的单面面密度，并描述其与界面膜和电池性能的关系。","claim_type":"来源事实","evidence_ids":["evidence-2"]},{"statement":"CN121394359A 的摘要披露对高镍三元正极材料界面的处理，并描述对界面化学稳定性和电芯制成稳定性的改善。","claim_type":"来源事实","evidence_ids":["evidence-3"]},{"statement":"将面密度、压实和界面稳定化收敛到既有制造链中的有限试验窗口，可能比同步改动电芯结构和多项制造要素更适合作为当前的最小验证路径。","claim_type":"工程推断","evidence_ids":["evidence-1","evidence-2","evidence-3"]}]}};</script>

<div class="shell"><aside class="rail"><div class="brand">技术方案探索<small>锂电池研发</small></div><p class="rail-label">本次探索</p><nav id="progress" class="progress" aria-label="探索进度"></nav><p class="rail-note">预设案例演示<br>包含历史案例回放与演示补写，不运行实时模型或检索。</p></aside><main><header class="topbar"><strong>技术方案探索</strong><div class="top-actions"><span class="badge">案例演示 · 预设交互</span><button id="restart">重新开始</button></div></header><div id="app" class="wrap"></div><div id="patentPage" class="wrap" hidden></div></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const data=window.PUBLIC_DEMO_CASE;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bullets=items=>(items||[]).length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">尚未提供，待后续验证。</p>';
const fields=items=>`<dl class="fields">${items.map(([label,value])=>`<div><dt>${esc(label)}</dt><dd>${esc(value||'尚未提供')}</dd></div>`).join('')}</dl>`;
const initialState=()=>({phase:'input',answers:{},round:-1,edited:false,added:false,panel:null,tab:'details',confirmed:false});
let state=initialState(),zoom=1,observer=null,timer=null,toastTimer=null,originFocus=null;
const folded=new Set();
const solution=id=>data.solutions.find(s=>s.id===id);
const activeSolutions=()=>data.solutions.filter(s=>s.round<=state.round);
const directions=()=>data.directions.map(d=>state.edited&&d.id===data.direction_edit.id?data.direction_edit:d).concat(state.added?[data.direction_add]:[]);
const unknownStatus=()=>state.answers.baseline==='unknown'?'用户确认暂不确定，后续验证时补充':'用户未补充，作为待确认信息保留';
const heading=(title,description,actions='')=>`<div class="heading"><div><h1 tabindex="-1" id="pageTitle">${esc(title)}</h1><p>${esc(description)}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
const say=(who,body)=>`<section class="message ${who==='你'?'user':''}"><div class="author">${esc(who)}</div>${body}</section>`;
const toast=message=>{$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2800)};
function progress(){const labels=['输入问题','澄清与确认','探索方案','继续深化','查看报告'];const index=state.phase==='input'?0:['clarify','confirm'].includes(state.phase)?1:state.phase==='report'?4:state.round>0?3:2;$('progress').innerHTML=labels.map((label,i)=>`<div class="progress-item ${i===index?'active':i<index?'done':''}" ${i===index?'aria-current="step"':''}><b>${i<index?'✓':i+1}</b>${label}</div>`).join('')}
function go(phase){state.phase=phase;state.panel=null;render();$('pageTitle')?.focus();window.scrollTo(0,0)}
function advance(action,message){if(timer)return;observer?.disconnect();$('app').innerHTML=`<div class="busy" role="status">${esc(message)}<p class="hint">正在展开预设内容</p></div>`;timer=setTimeout(()=>{timer=null;action();render();$('pageTitle')?.focus();},320)}
function conversationHistory(){return say('你',`<p>${esc(data.opening_input)}</p>`)+say('技术方案探索',`<p>${esc(data.clarification.note)}</p>`)+say('你',`<p>目标：260 Wh/kg；约束：总体积不增加。</p><p class="muted">其他信息：${esc(unknownStatus())}。</p>`)}
function history(){return `<details class="history"><summary>回看问题澄清与本次探索记录</summary><div class="history-body"><p><strong>初始输入</strong>　${esc(data.opening_input)}</p><p><strong>澄清与补充</strong>　目标为 260 Wh/kg；总体积不增加。${esc(unknownStatus())}。</p><p><strong>已确认问题</strong>　${esc(data.problem.objective)}</p>${activeSolutions().filter(s=>s.parent_id).map(s=>`<p><strong>第 ${s.round} 轮深化</strong>　${esc(s.refinement)}</p>`).join('')}<small>输入与澄清为演示补写；原始方案与第一轮深化来自历史案例，第二轮深化为演示补写。</small></div></details>`}
function inputView(){$('app').innerHTML=heading('从一个技术问题开始','描述你想改善的问题，逐步明确目标与约束。')+`<div class="conversation">${say('技术方案探索','<p>可以从一个还不完整的想法开始。我会先帮你明确问题，再围绕不同技术方向展开方案。</p>')}<section class="panel composer"><label for="initialInput">你的技术问题</label><textarea id="initialInput" readonly aria-describedby="inputHint">${esc(data.opening_input)}</textarea><p id="inputHint" class="hint">本次体验使用预设锂电池案例，点击发送即可开始。</p><div class="actions"><small>无需登录或配置环境</small><button class="primary" id="sendInput">发送问题</button></div></section></div>`;$('sendInput').onclick=()=>advance(()=>state.phase='clarify','展开问题理解与澄清')}
function clarifyView(){$('app').innerHTML=heading('先把问题说清楚','选择案例中的目标与约束，再确认本次探索边界。')+`<div class="conversation">${say('你',`<p>${esc(data.opening_input)}</p>`)}${say('技术方案探索',`<p>我理解你希望探索提升锂电池能量密度的技术路线。</p><p>${esc(data.clarification.note)}</p><small>澄清对话为演示补写，回答采用预设选项。</small>`)}<form id="clarificationForm" class="panel composer">${data.clarification.questions.map(q=>`<fieldset class="question"><legend>${esc(q.label)}${q.required?'':'（可选）'}</legend><small>${esc(q.reason)}</small>${q.options.map(o=>`<label class="choice"><input type="radio" name="${esc(q.id)}" value="${esc(o.id)}" ${state.answers[q.id]===o.id?'checked':''}><span>${esc(o.label)}</span></label>`).join('')}</fieldset>`).join('')}<div class="actions"><span id="answerHint" class="hint">请先选择目标值和体积约束。</span><button id="submitAnswers" class="primary" type="submit" disabled>提交补充信息</button></div></form></div>`;const form=$('clarificationForm');const update=()=>{const f=new FormData(form);state.answers=Object.fromEntries(f.entries());const ready=data.clarification.questions.filter(q=>q.required).every(q=>state.answers[q.id]);$('submitAnswers').disabled=!ready;$('answerHint').textContent=ready?'可选信息暂不回答也可以继续。':'请先选择目标值和体积约束。'};form.onchange=update;form.onsubmit=e=>{e.preventDefault();if($('submitAnswers').disabled)return;go('confirm')};update()}
function confirmView(){$('app').innerHTML=heading('确认本次探索问题','确认后，所有方向、方案和报告将围绕同一个问题展开。')+`<div class="conversation">${conversationHistory()}${say('技术方案探索','<p>目标和体积边界已明确，可以开始探索。以下信息将作为本次探索的共同依据。</p>')}<section class="panel composer">${fields([['技术对象',data.problem.technical_object],['目标',data.problem.objective],['硬约束',data.problem.constraints.join('；')],['待确认信息',data.problem.unknowns.join('；')],['补充状态',unknownStatus()]])}<p class="note">方案与专利材料用于形成研发思路，不代表已达到 260 Wh/kg 或完成工程验证。</p><div class="actions"><button id="editAnswers">返回调整补充信息</button><button class="primary" id="confirmProblem">确认问题并探索方向</button></div></section></div>`;$('editAnswers').onclick=()=>go('clarify');$('confirmProblem').onclick=()=>advance(()=>{state.confirmed=true;state.phase='map'},'展开预设技术方向')}
function pathOf(s){const result=[],seen=new Set();while(s&&!seen.has(s.id)){seen.add(s.id);result.unshift(s);s=solution(s.parent_id)}return result}
function mapCard(s,parentId){const children=activeSolutions().filter(x=>x.parent_id===s.id),collapsed=folded.has(s.id);return `<div class="mind-branch"><article class="mind-card mind-solution ${state.panel?.id===s.id?'selected':''}" data-map-node="${s.id}" data-map-parent="${parentId}"><div class="mind-card-head"><b>技术方案</b><span>${s.round?`第 ${s.round} 轮深化`:'初始方案'}</span></div><h3>${esc(s.title)}</h3><span class="badge">${esc(s.claim_type)}</span><p>${esc(s.summary)}</p>${s.parent_id?'<small>由父方案深化 · 原方案保留</small>':''}<div class="mind-actions"><button data-read="${s.id}">查看详情</button>${s.round===state.round&&state.round<2?`<button class="primary" data-refine="${s.id}">继续深化</button>`:''}${children.length?`<button data-fold="${s.id}" aria-expanded="${!collapsed}">${collapsed?'展开':'收起'}分支</button>`:''}</div>${s.round===2?'<p class="hint">已完成本案例的两轮深化。</p>':''}</article>${children.length&&!collapsed?`<div class="mind-children">${children.map(c=>mapCard(c,s.id)).join('')}</div>`:''}</div>`}
function directionCard(d){const roots=activeSolutions().filter(s=>s.direction_id===d.id&&!s.parent_id),count=activeSolutions().filter(s=>s.direction_id===d.id).length,collapsed=folded.has(d.id);return `<div class="mind-branch"><article class="mind-card mind-direction ${count?'mind-explored':''}" data-map-node="${d.id}" data-map-parent="problem"><div class="mind-card-head"><b>技术方向</b><span>${count?'已探索':'待探索'}</span></div><span class="badge">${esc(d.scope)}</span><h3>${esc(d.title)}</h3><p>${esc(d.summary)}</p><dl><dt>改变对象</dt><dd>${esc(d.focus)}</dd><dt>预期作用</dt><dd>${esc(d.expected_effect)}</dd></dl><details><summary>约束与边界</summary><p>${esc(d.constraint)}</p></details><div class="mind-actions">${count?`<button data-fold="${d.id}" aria-expanded="${!collapsed}">${collapsed?'展开':'收起'}方案（${count}）</button>`:d.id===data.target_direction_id?'<button id="exploreDirection" class="primary">探索这个方向</button>':'<small>此方向未预置探索结果</small>'}${d.id===data.direction_edit.id&&!state.edited?'<button id="editDirection">调整方向</button>':''}</div></article>${roots.length&&!collapsed?`<div class="mind-children">${roots.map(s=>mapCard(s,d.id)).join('')}</div>`:''}</div>`}
function mapView(){const viewport=$('mapViewport'),scroll=viewport?{left:viewport.scrollLeft,top:viewport.scrollTop}:null;observer?.disconnect();$('app').classList.add('map-mode');$('app').innerHTML=heading('技术方案全景',state.round<0?'选择一条技术方向，展开方案与专利证据。':`已形成 ${activeSolutions().length} 个方案，父方案和每轮深化关系均已保留。`,state.round>=0?'<button id="showReport" class="primary">生成探索报告</button>':'')+history()+`<div class="workspace ${state.panel?'with-reader':''}"><section class="panel mind-panel"><div class="mind-toolbar"><strong>问题 → 方向 → 方案</strong><div class="mind-tools"><button id="zoomOut" aria-label="缩小画布">−</button><output id="zoomValue">100%</output><button id="zoomIn" aria-label="放大画布">＋</button><button id="resetMap">重置视图</button><button id="focusMap">定位当前方案</button></div></div><div id="mapViewport" class="mind-viewport" tabindex="0" aria-label="技术方案思维导图，可滚动浏览"><div id="mapSizer" class="mind-sizer"><div id="mapContent" class="mind-content"><svg id="mapEdges" class="mind-edges" aria-hidden="true"></svg><article class="mind-card mind-problem" data-map-node="problem"><div class="mind-card-head"><b>已确认的技术问题</b></div><h3>${esc(data.problem.confirmed_input)}</h3><p>${esc(data.problem.technical_object)}</p><small>硬约束：${esc(data.problem.constraints.join('；'))}</small></article><div class="mind-directions">${directions().map(directionCard).join('')}</div></div></div></div><div class="mind-footer">拖动或滚动画布浏览 · 虚线表示深化来源 · 方案详情保留证据与限制${!state.added?'　<button id="addDirection" class="text">添加预设方向</button>':''}</div></section>${state.panel?readerView():''}</div>`;
$('exploreDirection')?.addEventListener('click',()=>advance(()=>{state.round=0;state.panel=null},'展开历史方案与证据'));
$('editDirection')?.addEventListener('click',()=>openPanel('edit'));
$('addDirection')?.addEventListener('click',()=>openPanel('add'));
$('showReport')?.addEventListener('click',()=>advance(()=>{state.phase='report';state.panel=null},'整理当前探索报告'));
document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>openPanel('solution',b.dataset.read));document.querySelectorAll('[data-refine]').forEach(b=>b.onclick=()=>openPanel('refine',b.dataset.refine));document.querySelectorAll('[data-fold]').forEach(b=>b.onclick=()=>{const id=b.dataset.fold;folded.has(id)?folded.delete(id):folded.add(id);mapView()});
$('zoomOut').onclick=()=>setZoom(zoom-.1);$('zoomIn').onclick=()=>setZoom(zoom+.1);$('resetMap').onclick=()=>{setZoom(1);$('mapViewport').scrollTo(0,0)};$('focusMap').onclick=focusMap;
const v=$('mapViewport');let drag=null;v.onpointerdown=e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('button,summary,input'))return;drag={x:e.clientX,y:e.clientY,left:v.scrollLeft,top:v.scrollTop};v.setPointerCapture(e.pointerId);v.classList.add('is-dragging')};v.onpointermove=e=>{if(drag){v.scrollLeft=drag.left-e.clientX+drag.x;v.scrollTop=drag.top-e.clientY+drag.y}};v.onpointerup=v.onpointercancel=()=>{drag=null;v.classList.remove('is-dragging')};document.querySelectorAll('.mind-card details').forEach(d=>d.ontoggle=drawMap);observer=new ResizeObserver(drawMap);observer.observe($('mapContent'));setZoom(zoom);if(scroll)v.scrollTo(scroll.left,scroll.top);else if(state.round>=0)requestAnimationFrame(focusMap);bindReader();}
function drawMap(){const c=$('mapContent');if(!c||!c.getBoundingClientRect().width)return;const box=c.getBoundingClientRect(),w=c.offsetWidth,h=c.offsetHeight;$('mapSizer').style.width=w*zoom+'px';$('mapSizer').style.height=h*zoom+'px';const nodes=[...c.querySelectorAll('[data-map-node]')],byId=new Map(nodes.map(n=>[n.dataset.mapNode,n]));$('mapEdges').setAttribute('viewBox',`0 0 ${w} ${h}`);$('mapEdges').innerHTML=nodes.filter(n=>n.dataset.mapParent).map(n=>{const p=byId.get(n.dataset.mapParent);if(!p)return '';const a=p.getBoundingClientRect(),b=n.getBoundingClientRect(),x1=(a.right-box.left)/zoom,y1=(a.top+a.height/2-box.top)/zoom,x2=(b.left-box.left)/zoom,y2=(b.top+b.height/2-box.top)/zoom,m=(x1+x2)/2;return `<path class="${n.classList.contains('mind-solution')&&solution(n.dataset.mapNode).parent_id?'derived':''}" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/>`}).join('')}
function setZoom(value){zoom=Math.max(.5,Math.min(1.3,Math.round(value*10)/10));$('mapContent').style.transform=`scale(${zoom})`;$('zoomValue').textContent=Math.round(zoom*100)+'%';$('zoomOut').disabled=zoom<=.5;$('zoomIn').disabled=zoom>=1.3;drawMap()}
function focusMap(){const id=state.panel?.id||activeSolutions().at(-1)?.id||data.target_direction_id;const target=document.querySelector(`[data-map-node="${id}"]`),v=$('mapViewport');if(!target||!v)return;const a=target.getBoundingClientRect(),b=v.getBoundingClientRect();v.scrollTo({left:v.scrollLeft+a.left-b.left-Math.max(24,(v.clientWidth-a.width)/2),top:v.scrollTop+a.top-b.top-24})}
function openPanel(kind,id=null){originFocus=document.activeElement?.dataset?.read||document.activeElement?.dataset?.refine||null;state.panel={kind,id};state.tab='details';mapView();$('readerTitle')?.focus({preventScroll:true});if(window.innerWidth>840)requestAnimationFrame(focusMap);if(window.innerWidth<=840)$('readerTitle')?.scrollIntoView({block:'start'})}
function closePanel(){state.panel=null;mapView();if(originFocus)document.querySelector(`[data-read="${originFocus}"]`)?.focus();else $('pageTitle')?.focus()}
function evidenceView(bindings,compact=false){const ids=[...new Set(bindings.map(b=>b.evidence_id))];return ids.length?`<div class="${compact?'patent-list':'patent-grid'}">${ids.map(id=>{const e=data.evidence.find(x=>x.id===id);return `<button class="${compact?'patent-row':'patent-card'}" data-patent="${esc(id)}" aria-label="查看专利 ${esc(e.publication_number)} 的模拟详情"><span class="patent-number">${esc(e.publication_number)}</span><strong class="patent-title">${esc(e.title)}</strong>${compact?'':`<span class="patent-excerpt">${esc(e.excerpt||'案例未提供摘要。')}</span><span class="patent-action">查看详情 →</span>`}</button>`}).join('')}</div>`:'<p class="muted">当前没有可展示的证据。</p>'}
let patentReturn=null;
function openPatent(id,trigger){const e=data.evidence.find(x=>x.id===id);if(!e)return;patentReturn={trigger,top:window.scrollY,readerTop:document.querySelector('.reader')?.scrollTop||0,mapLeft:$('mapViewport')?.scrollLeft||0,mapTop:$('mapViewport')?.scrollTop||0};$('app').hidden=true;$('patentPage').hidden=false;$('patentPage').innerHTML=`<div class="heading"><div><h1 id="patentTitle" tabindex="-1">专利详情</h1><p>详情演示 · 根据案例中已有专利信息展示</p></div><button id="backFromPatent">${state.phase==='report'?'返回探索报告':'返回相关证据'}</button></div><article class="panel patent-detail"><span class="badge">详情演示</span><p class="patent-number" style="margin-top:20px">${esc(e.publication_number)}</p><h2>${esc(e.title)}</h2><h3>摘要</h3><p class="patent-abstract">${esc(e.excerpt||'案例未提供摘要。')}</p><p class="note">本页用于模拟专利详情阅读，不代表实时专利数据库或完整专利文本。</p></article>`;$('backFromPatent').onclick=()=>closePatent();$('patentTitle').focus();window.scrollTo(0,0)}
function closePatent(restore=true){if(!patentReturn)return;const saved=patentReturn;patentReturn=null;$('patentPage').hidden=true;$('patentPage').innerHTML='';$('app').hidden=false;if(restore){requestAnimationFrame(()=>{const r=document.querySelector('.reader'),v=$('mapViewport');if(r)r.scrollTop=saved.readerTop;if(v)v.scrollTo(saved.mapLeft,saved.mapTop);drawMap();saved.trigger?.focus({preventScroll:true});window.scrollTo(0,saved.top)})}}
$('app').addEventListener('click',event=>{const card=event.target.closest('[data-patent]');if(card)openPatent(card.dataset.patent,card)});

function solutionBody(s){return `<p class="path">${esc(pathOf(s).map(x=>x.title).join(' → '))}</p><p><span class="badge">${esc(s.origin)}</span> <span class="badge">${esc(s.claim_type)}</span></p><p>${esc(s.summary)}</p>${s.refinement?fields([['本轮补充要求',s.refinement]]):''}${fields([['核心机理',s.mechanism],['关键变化',s.changes.join('；')],['预期收益',s.benefits.join('；')]])}<h3>实施步骤</h3>${bullets(s.steps)}<h3>风险与验证</h3>${bullets([...s.risks,...s.validation])}<h3>假设与限制</h3>${bullets([...s.assumptions,...s.limitations])}<p class="note">${esc(s.evidence_note)}</p>`}
function readerView(){const panel=state.panel,s=solution(panel.id);let title='',body='',label='';if(panel.kind==='solution'){title=s.title;label='技术方案';body=`<div class="tabs" role="tablist" aria-label="方案阅读内容"><button role="tab" aria-selected="${state.tab==='details'}" id="detailsTab">方案详情</button><button role="tab" aria-selected="${state.tab==='evidence'}" id="evidenceTab">相关证据（${s.evidence.length}）</button></div>${state.tab==='details'?solutionBody(s):`<p class="note">${esc(s.evidence_note)}</p>${evidenceView(s.evidence)}`}${s.round===state.round&&state.round<2?'<div class="sticky-action"><button id="continueSolution" class="primary">继续深化这个方案</button></div>':''}`;}else if(panel.kind==='refine'){const next=data.solutions.find(x=>x.parent_id===s.id);title=`第 ${next.round} 轮方案深化`;label='补充要求';body=`<p class="muted">保留父方案，在它的基础上继续探索。</p>${fields([['当前父方案',s.title],['继承上下文','父方案原始内容与已绑定证据']])}<h3>本轮希望如何调整？</h3><textarea readonly aria-label="本轮预设补充要求">${esc(next.refinement)}</textarea><p class="hint">${esc(next.origin)} · ${esc(next.evidence_note)}</p><div class="sticky-action"><button id="cancelRefinement">取消</button><button id="confirmRefinement" class="primary">提交要求并深化</button></div>`;}else{const d=panel.kind==='edit'?data.direction_edit:data.direction_add;title=panel.kind==='edit'?'调整技术方向':'添加技术方向';label='预设方向';body=`<p class="muted">应用案例中预置的方向${panel.kind==='edit'?'调整':'补充'}，不运行实时生成。</p>${fields([['方向名称',d.title],['方向说明',d.summary],['约束边界',d.constraint]])}<div class="sticky-action"><button id="cancelDirection">取消</button><button id="applyDirection" class="primary">应用预设${panel.kind==='edit'?'调整':'方向'}</button></div>`;}return `<aside class="panel reader" aria-label="上下文阅读区"><header class="reader-header"><div><small>${label}</small><h2 id="readerTitle" tabindex="-1">${esc(title)}</h2></div><button id="closeReader" aria-label="返回导图">返回导图</button></header><div class="reader-body">${body}</div></aside>`}
function bindReader(){$('closeReader')?.addEventListener('click',closePanel);for(const [id,tab] of [['detailsTab','details'],['evidenceTab','evidence']])$(id)?.addEventListener('click',()=>{state.tab=tab;mapView();$(id)?.focus()});$('continueSolution')?.addEventListener('click',()=>openPanel('refine',state.panel.id));$('cancelRefinement')?.addEventListener('click',()=>openPanel('solution',state.panel.id));$('confirmRefinement')?.addEventListener('click',()=>advance(()=>{state.round++;folded.clear();state.panel={kind:'solution',id:activeSolutions().at(-1).id};state.tab='details';toast('新方案已加入全景，父方案已保留')},'展开本轮预设深化结果'));$('cancelDirection')?.addEventListener('click',closePanel);$('applyDirection')?.addEventListener('click',()=>{if(state.panel.kind==='edit')state.edited=true;else state.added=true;state.panel=null;mapView();toast('预设方向已更新')})}
function reportView(){
 const all=activeSolutions(),latest=all.at(-1),used=[...new Set(all.flatMap(s=>s.evidence.map(e=>e.evidence_id)))],appendix=used.map(evidence_id=>({evidence_id}));
 const conclusion=['本次重点探索高镍正极路线，形成面密度、压实与界面稳定化协同调整的方案，作为后续工程验证的起点。','本次将高镍正极路线深化为既有涂布、辊压与界面处理内的分段试验窗口，以减少结构改动并验证工程可实施性。','本次沿高镍正极路线完成两轮深化，形成极片初筛、界面处理配对、固定外形整芯对照的分阶段验证路径。'][latest.round];
 const roundLabel=s=>s.round?`第 ${s.round} 轮深化`:'初始方案';
 $('app').innerHTML=heading('技术方案探索报告','先看探索结论与变化，需要时展开完整方案。','<button id="backToMap">返回技术方案全景</button>')+`<article class="panel report">
 <header class="report-cover"><span class="badge">预设案例 · ${all.length} 个方案 · ${Math.max(state.round,0)} 轮深化</span><h2>${esc(data.report.title)}</h2></header>
 <section class="report-section report-overview"><h3>01 问题与结论</h3><p><strong>核心问题：</strong>${esc(data.problem.objective)}</p><p><strong>探索结论：</strong>${esc(conclusion)}</p></section>
 <section class="report-section"><h3>02 路线与深化过程</h3><div class="table-wrap"><table><thead><tr><th>技术方向</th><th>探索状态</th><th>预期作用</th></tr></thead><tbody>${directions().map(d=>`<tr><td>${esc(d.title)}</td><td class="${all.some(s=>s.direction_id===d.id)?'status-done':''}">${all.some(s=>s.direction_id===d.id)?'已探索':'未探索'}</td><td>${esc(d.expected_effect)}</td></tr>`).join('')}</tbody></table></div><p class="hint">${directions().filter(d=>!all.some(s=>s.direction_id===d.id)).length} 个方向尚未探索，不能据此比较或排序。</p>
 <div class="report-timeline">${all.map(s=>`<article class="report-solution" data-report-solution="${s.id}"><span class="round-label">${roundLabel(s)}</span>${s.origin==='演示补写'?' <span class="badge warning">演示补写</span>':''}<h4>${esc(s.title)}</h4>${s.parent_id?`<p class="path" data-parent-id="${s.parent_id}">基于${roundLabel(solution(s.parent_id))}继续深化 · 父方案保留</p><p><strong>本轮要求：</strong>${esc(s.refinement)}</p>`:''}<p><strong>${s.round?'本轮变化':'方案要点'}：</strong>${esc(s.summary)}</p><details class="report-detail"><summary>展开完整方案</summary>${solutionBody(s)}</details></article>`).join('')}</div></section>
 <section class="report-section"><h3>03 下一步验证</h3><h4>验证项</h4>${bullets(latest.validation)}<details><summary>查看实施顺序</summary>${bullets(latest.steps)}</details><details><summary>查看来源事实与工程判断</summary>${data.report.findings.filter(f=>f.evidence_ids.every(id=>used.includes(id))&&(state.round>0||f.claim_type==='来源事实')).map(f=>`<p><span class="badge">${esc(f.claim_type)}</span> ${esc(f.statement)}</p>`).join('')}</details></section>
 <section class="report-section"><h3>04 参考专利</h3><p class="hint">${used.length} 篇，已去重。点击条目查看专利详情演示。</p>${evidenceView(appendix,true)}<p class="note">${state.round>0?'深化方案沿用父方案证据，未新增检索。':''}专利摘要仅提供相关技术参考，不证明方案有效。</p></section><div class="actions"><button id="reportReturn">返回技术方案全景</button></div></article>`;
 for(const id of ['backToMap','reportReturn'])$(id).onclick=()=>go('map');
}
function render(){observer?.disconnect();$('app').classList.remove('map-mode');if(!data||data.version!==2){$('app').innerHTML=heading('案例暂时无法加载','请刷新页面重试；本页不会运行实时模型。');return}progress();({input:inputView,clarify:clarifyView,confirm:confirmView,map:mapView,report:reportView}[state.phase])()}
